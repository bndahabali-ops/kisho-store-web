# =============================================================
# netlify.toml — Kisho Web App (Angular 16)
# Repo root: kisho-web-app/
# =============================================================

# -------------------------------------------------------------
# [build] — How Netlify builds the project
# -------------------------------------------------------------
[build]
  # The Angular CLI build command targeting the production configuration.
  # This triggers fileReplacements → swaps environment.ts with environment.prod.ts
  # injecting: https://kisho-store-backend-production.up.railway.app/api
  command = "npm ci && npx ng build --configuration production"

  # Angular 16 (builder: @angular-devkit/build-angular:browser) outputs
  # directly to dist/[project-name] — NOT dist/[project-name]/browser.
  # (The /browser sub-folder only applies to Angular 17+ application builder)
  publish = "dist/kisho-web-app"

# -------------------------------------------------------------
# [build.environment] — CI environment variables
# Netlify uses Node 18 LTS by default. Angular 16 is fully
# supported on Node 18. Pin it explicitly to avoid Netlify
# randomly switching to an incompatible version.
# -------------------------------------------------------------
[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS    = "--legacy-peer-deps"

# -------------------------------------------------------------
# [[redirects]] — SPA Fallback Rule
# Without this, any deep-linked route (e.g. /shop/product/123)
# returns a Netlify 404 because there's no physical file at
# that path — only index.html. This rule catches every request
# that doesn't match a real file/directory and serves index.html
# with a 200 (not a redirect), letting Angular Router handle it.
# -------------------------------------------------------------
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# -------------------------------------------------------------
# [[headers]] — Production Security & Performance Headers
# Applies to all routes served from the publish directory.
# -------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache-bust hashed JS/CSS bundles aggressively (safe — Angular adds
# content hashes to filenames when outputHashing = "all")
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html should never be cached so users always get the latest shell
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
